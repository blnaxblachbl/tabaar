syntax = "proto3";

service UserService {
  rpc GetUsers(GetUsersRequest) returns (GetUsersResponse);
  rpc GetOneUser(GetOneUserRequest) returns (GetOneUserResponse);
  rpc CreateUser(CreateUserRequest) returns (CreateUserResponse);
  rpc UpdateUser(UpdateUserRequest) returns (UpdateUserResponse);
  rpc DeleteUser(DeleteUserRequest) returns (DeleteUserResponse);
}

message DeleteUserResponse {
  User user = 1;
}
message DeleteUserRequest {
  int32 id = 1;
}
message UpdateUserRequest {
  message UpdateUserRequestData {
    optional string name = 1;
    optional string email = 2;
  }
  int32 id = 1;
  UpdateUserRequestData data = 2;
}
message UpdateUserResponse {
  User user = 1;
}
message CreateUserRequest {
  string name = 1;
  string email = 2;
}
message CreateUserResponse {
  User user = 1;
}

message GetOneUserResponse {
  User user = 1;
}

message GetOneUserRequest {
  int32 id = 1;
}

message GetUsersRequest {
  optional int32 skip = 1;
  optional int32 take = 2;
}

message GetUsersResponse {
  repeated User users = 1;
  int32 users_count = 2;
}

message User {
  int32 id = 1;
  string created_at = 2;
  string updated_at = 3;
  string name = 4;
  string email = 5;
}
